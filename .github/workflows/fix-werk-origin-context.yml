name: Fix Werk origin context
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-werk-origin-context.yml']
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Patch app core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/app-core.js'); s=p.read_text()
          s=s.replace("let session=null,organization=null,records=[],authMode='login',detailId=null;","let session=null,organization=null,originWerkId='',records=[],authMode='login',detailId=null;",1)
          old="async function loadOrganization(){const ehsAccess=await waitForEhsAccess();let query="
          new="async function loadOrganization(){const ehsAccess=await waitForEhsAccess();const selectedWerk=ehsAccess?.selectedWerk||(Array.isArray(ehsAccess?.works)&&ehsAccess.works.length===1?ehsAccess.works[0]:null);originWerkId=String(selectedWerk?.id||'');if(!originWerkId){notify('Bitte Gefahrstoffkataster über das EHS-Dashboard öffnen und ein Werk auswählen.');organization=null;return;}let query="
          if new not in s:
              assert old in s, 'organization anchor missing'; s=s.replace(old,new,1)
          old="const {data,error}=await sb.from('hazardous_substances').select('*').eq('organization_id',organization.organization_id).order('inventory_number');"
          new="const {data,error}=await sb.from('hazardous_substances').select('*').eq('organization_id',organization.organization_id).eq('origin_werk_id',originWerkId).order('inventory_number');"
          if new not in s:
              assert old in s, 'list anchor missing'; s=s.replace(old,new,1)
          old="else{payload.created_by=session.user.id;const {error}=await sb.from('hazardous_substances').insert(payload);"
          new="else{payload.created_by=session.user.id;payload.origin_werk_id=originWerkId;const {error}=await sb.from('hazardous_substances').insert(payload);"
          if new not in s:
              assert old in s, 'insert anchor missing'; s=s.replace(old,new,1)
          old=".update({status:'archived',updated_by:session.user.id}).eq('id',id);"
          new=".update({status:'archived',updated_by:session.user.id}).eq('id',id).eq('origin_werk_id',originWerkId);"
          if new not in s:
              assert old in s, 'archive anchor missing'; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check assets/app-core.js
          grep -q 'origin_werk_id=originWerkId' assets/app-core.js
          grep -q "eq('origin_werk_id',originWerkId)" assets/app-core.js
      - name: Tests x3
        run: for i in 1 2 3; do npm test; done
      - name: Commit
        run: |
          git config user.name 'DefiDev Automation'; git config user.email 'actions@users.noreply.github.com'
          git add assets/app-core.js
          git diff --cached --quiet && exit 0
          git commit -m 'Scope Gefahrstoff records to selected Werk'
          git push
